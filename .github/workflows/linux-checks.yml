name: Linux build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf aria2
      - name: Check Linux prerequisites
        run: bash scripts/doctor.sh
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck and build frontend
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Local aria2 RPC and pause/resume integration tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
