name: Linux build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf aria2
      - name: Check Linux prerequisites
        run: bash scripts/doctor.sh
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck and build frontend
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Python syntax checks
        run: python3 -m compileall -q tests
      - name: Local HTTP checksum smoke test
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p "test_aria2_rpc.py" -v
      - name: Session restore test
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p "test_aria2_session.py" -v
      - name: HTTP pause and resume test
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -p "test_aria2_resume.py" -v
      - name: HTTP restart and resume test
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -p "test_aria2_restart_resume.py" -v
      - name: Build Ubuntu Debian installer
        run: npx tauri build --bundles deb
      - name: Upload Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: download-manager-ubuntu-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
