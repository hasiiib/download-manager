name: Linux build checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf aria2
      - name: Check Linux prerequisites
        run: bash scripts/doctor.sh
      - name: Validate version and Tauri packaging configuration
        run: python3 -m unittest discover -s tests -p "test_project_config.py" -v
      - name: Validate Debian package checker unit tests
        run: python3 -m unittest discover -s tests -p "test_deb_checker.py" -v
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Tauri icon before CLI checks
        run: python3 scripts/generate_icon.py
      - name: Typecheck and build frontend
        run: npm run build
      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Archive resolved dependency lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-dependency-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
      - name: Python syntax checks
        run: python3 -m compileall -q tests
      - name: Local HTTP checksum smoke test
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p "test_aria2_rpc.py" -v
      - name: Session restore test
        timeout-minutes: 2
        run: python3 -m unittest discover -s tests -p "test_aria2_session.py" -v
      - name: HTTP pause and resume test
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -p "test_aria2_resume.py" -v
      - name: HTTP restart and resume test
        timeout-minutes: 3
        run: python3 -m unittest discover -s tests -p "test_aria2_restart_resume.py" -v
      - name: Build Ubuntu Debian installer
        run: npx tauri build --bundles deb
      - name: Verify Debian installer payload and dependencies
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Debian installer; found ${#packages[@]}"
            exit 1
          fi
          python3 scripts/check_deb.py "${packages[0]}"
      - name: Generate installer SHA-256 checksum
        run: |
          cd src-tauri/target/release/bundle/deb
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Upload Debian installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: download-manager-ubuntu-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
